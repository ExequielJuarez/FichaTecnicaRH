<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/Header.css">
    <link rel="stylesheet" href="/public/css/CargaFichaVehiculo.css">
    <title>Cargar Vehículo</title>
</head>
<body>
    <div class="layout">

        <aside class="Side-bar">
            <ul class="side-bar-options">
                <li class="activo">Vehículos</li>
                <li class="activo">Choferes</li>
                <li class="activo">Mantenimientos</li>
                <li class="activo">Documentación</li>
                <li class="activo">Proveedores</li>
                <li class="activo">Reportes</li>
                <li class="activo">Alertas</li>
            </ul>
        </aside>

        <div class="main-area">

            <header>
                <section class="iconBar"><i class="fa-solid fa-bars"></i></section>
                <section class="contLogo">
                    <img class="imgLogo" src="/public/images/header/images-removebg-preview (1).png">
                </section>
                <section class="iconUser2"><i class="fa-regular fa-user"></i></section>
            </header>
        
                <main class="container">

                    <h2>Cargar Vehículo</h2>
                    <p>Complete todos los datos del vehículo.</p>

                    <div class="acciones">
                        <button class="boton-secundario">Volver</button>
                        <button class="boton-primario">Guardar Vehículo</button>
                    </div>

                    <form class="form">

                        <section class="form-section">
                            <h3>Información Básica</h3>

                            <div class="form-group">
                                <label>Patente</label>
                                <input type="text" placeholder="Ej: AB123CD">
                            </div>

                            <div class="form-group">
                                <label>Tipo de Vehículo</label>
                                <select>
                                    <option value="">Seleccione tipo</option>
                                    <option>Camioneta</option>
                                    <option>Camión</option>
                                    <option>Maquinaria</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Marca</label>
                                    <input type="text">
                                </div>
                                <div class="form-group">
                                    <label>Modelo</label>
                                    <input id="modelo-input" type="text">
                                </div>
                            </div>

                            <div class="form-group small">
                                <label>Año</label>
                                <input type="number">
                            </div>
                        </section>


                        <section class="form-section">
                            <h3>Información Técnica</h3>

                            <div class="form-group">
                                <label>Número de Chasis</label>
                                <input type="text">
                            </div>

                            <div class="form-group">
                                <label>Número de Motor</label>
                                <input type="text">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Combustible</label>
                                    <select>
                                        <option value="">Seleccionar</option>
                                        <option>Diésel</option>
                                        <option>Nafta</option>
                                        <option>Electrico</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Transmisión</label>
                                    <select>
                                        <option value="">Seleccionar</option>
                                        <option>Manual</option>
                                        <option>Automática</option>
                                    </select>
                                </div>
                            </div>
                        </section>


                        <section class="form-section">
                            <h3>Estado y Ubicación</h3>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Estado</label>
                                    <select>
                                        <option>Disponible</option>
                                        <option>En uso</option>
                                        <option>Mantenimiento</option>
                                        <option>Fuera de servicio</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Kilometraje</label>
                                    <input id="km-input" type="number">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Distrito</label>
                                <select>
                                    <option>Centro</option>
                                    <option>Norte</option>
                                    <option>Sur</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Observaciones</label>
                                <textarea></textarea>
                            </div>
                        </section>


                        <section class="form-section">
                            <h3>Fechas</h3>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Fecha de Alta</label>
                                    <input type="date">
                                </div>

                                <div class="form-group">
                                    <label>Fecha de Baja</label>
                                    <input type="date">
                                </div>
                            </div>
                        </section>



                        <section class="form-section">
                            <h3>Imagen del Vehículo</h3>

                            <div class="upload-box">
                                <label for="imagen">Subir imagen</label>
                                <input type="file" id="imagen" hidden>
                            </div>
                            <div id="preview">
                                No hay imagen
                            </div>
                        </section>

                    </form>

                </main>

                <footer>
                    <p>* Campos obligatorios</p>
                </footer>
        </div>
    </div>

</body>
</html>
